<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPv6 国家归属查询 · 离线库测试</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
      background: radial-gradient(900px 500px at 20% -10%, #16233f 0%, #0b1220 45%, #070b14 100%);
      color: #e6edf7; padding: 24px 14px; -webkit-tap-highlight-color: transparent;
    }
    .wrap { width: 100%; max-width: 560px; }
    .brand { margin-bottom: 18px; font-size: 15px; font-weight: 700; letter-spacing: 1.5px; color: #8fa3c2; }
    .brand b { color: #e6edf7; }
    h1 { font-size: 22px; margin-bottom: 6px; background: linear-gradient(90deg, #93c5fd, #c4b5fd);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { font-size: 13px; color: #8fa3c2; margin-bottom: 18px; line-height: 1.7; }
    .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09);
      border-radius: 16px; padding: 20px; }
    .qbox { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
      color: #e6edf7; border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none;
      font-family: ui-monospace, Consolas, monospace; }
    input:focus { border-color: rgba(125,211,252,.6); }
    button { border: 1px solid rgba(125,211,252,.45); background: rgba(125,211,252,.12); color: #cde3ff;
      font-size: 15px; font-weight: 600; padding: 0 18px; border-radius: 10px; cursor: pointer; }
    button:hover { background: rgba(125,211,252,.22); }
    .rows { margin-top: 18px; display: none; }
    .rows.on { display: block; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 4px;
      border-bottom: 1px solid rgba(255,255,255,.07); font-size: 14px; word-break: break-all; }
    .row .k { color: #8fa3c2; white-space: nowrap; }
    .row .v { text-align: right; font-weight: 600; }
    .row .v.mono { font-family: ui-monospace, Consolas, monospace; font-weight: 400; }
    .state { margin-top: 16px; font-size: 13px; color: #93c5fd; line-height: 1.6; display: none; }
    .state.on { display: block; }
    .state.err { color: #fca5a5; }
    .note { margin-top: 16px; font-size: 12px; color: #5b6b84; line-height: 1.7; }
    .note a { color: #7dd3fc; text-decoration: none; }
    @media (max-width: 520px) { .qbox { flex-direction: column; } button { padding: 12px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">fzc0<b>.</b></div>
    <h1>IPv6 国家归属查询</h1>
    <p class="sub">输入任意 IPv6 地址，用内置离线国际库（DB-IP Lite，每月更新）查询，验证库的精度。</p>
    <div class="card">
      <div class="qbox">
        <input id="ip" placeholder="如 2001:4860:4860::8888" spellcheck="false">
        <button id="btn">查询</button>
      </div>
      <div class="state" id="state"></div>
      <div class="rows" id="rows">
        <div class="row"><span class="k">IP 地址</span><span class="v mono" id="r-ip">--</span></div>
        <div class="row"><span class="k">国家 / 地区</span><span class="v" id="r-country">--</span></div>
        <div class="row"><span class="k">国家代码</span><span class="v mono" id="r-cc">--</span></div>
        <div class="row"><span class="k">命中网段</span><span class="v mono" id="r-range">--</span></div>
      </div>
    </div>
    <p class="note">
      数据：DB-IP Lite · <a href="https://db-ip.com" target="_blank" rel="noopener">db-ip.com</a>（CC BY 4.0）·
      想查更细的国内归属地请用<a href="https://fzc0.cn" target="_blank" rel="noopener">主站 IP 检测</a>。
      仅支持 IPv6 地址，不支持域名。
    </p>
  </div>

  <script>
    const DATA = "data/v6-country.json.gz";
    const $ = (id) => document.getElementById(id);
    let rows = null;
    let loading = null;

    async function loadData() {
      if (rows) return rows;
      if (loading) return loading;
      setState("正在加载离线数据库（约 2.3MB）…");
      loading = (async () => {
        const res = await fetch(DATA);
        if (!res.ok || !res.body) throw new Error("数据库下载失败 HTTP " + res.status);
        const ds = res.body.pipeThrough(new DecompressionStream("gzip"));
        const text = await new Response(ds).text();
        rows = JSON.parse(text);
        return rows;
      })();
      try {
        await loading;
        setState("数据库就绪：" + rows.length.toLocaleString() + " 条 IPv6 网段");
        setTimeout(() => { const s = $("state"); if (s) s.classList.remove("on"); }, 2600);
      } catch (e) {
        rows = null;
        setState("加载失败：" + e.message + "（请换用支持 DecompressionStream 的现代浏览器）", true);
      } finally {
        loading = null;
      }
      return rows;
    }

    function toBig(s) {
      if (s === "") return 0n;
      let v = 0n;
      for (const c of s) v = (v << 4n) | BigInt(parseInt(c, 16));
      return v;
    }
    function parseIp6(ip) {
      const p = ip.split(":");
      const last = p[p.length - 1];
      if (last.includes(".")) {
        const [a, b, c, d] = last.split(".").map(Number);
        p[p.length - 1] = (((a << 8) | b) << 8 | c) << 8 | d;
      }
      const z = p.indexOf("");
      if (z >= 0) p.splice(z, 1, ...Array(8 - (p.length - 1)).fill("0"));
      let v = 0n;
      for (const x of p) v = (v << 16n) | BigInt(x ? parseInt(x, 16) : 0);
      return v;
    }
    function lookup(ip) {
      const v = parseIp6(ip);
      let lo = 0, hi = rows.length - 1, hit = null;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        const r = rows[mid];
        const s = toBig(r[0]), e = toBig(r[1]);
        if (v < s) hi = mid - 1;
        else if (v > e) lo = mid + 1;
        else { hit = r; break; }
      }
      return hit;
    }

    function setState(msg, err) {
      const s = $("state");
      s.className = "state on" + (err ? " err" : "");
      s.textContent = msg;
    }

    $("btn").addEventListener("click", run);
    $("ip").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });

    async function run() {
      const ip = $("ip").value.trim();
      if (!ip) return;
      if (!/^[0-9a-fA-F:.]+$/.test(ip) || !ip.includes(":")) {
        setState("请输入合法的 IPv6 地址", true);
        return;
      }
      try {
        const db = await loadData();
        const hit = lookup(ip);
        $("rows").className = "rows on";
        $("r-ip").textContent = ip;
        if (hit) {
          let name = hit[2];
          try {
            const n = new Intl.DisplayNames(["zh-CN"], { type: "region" }).of(hit[2].toUpperCase());
            if (n) name = n;
          } catch (e) {}
          $("r-country").textContent = name;
          $("r-cc").textContent = hit[2].toUpperCase();
          $("r-range").textContent = hit[0] + " ~ " + hit[1];
          setState("命中：国家归属准确率取决于库覆盖，可换几个地址对比验证");
        } else {
          $("r-country").textContent = "未收录";
          $("r-cc").textContent = "--";
          $("r-range").textContent = "--";
          setState("该地址不在库中（可能是保留段或库未覆盖）", true);
        }
      } catch (e) {
        setState("查询失败：" + e.message, true);
      }
    }

    loadData();
  </script>
</body>
</html>
